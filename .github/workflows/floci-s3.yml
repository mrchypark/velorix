name: Floci S3 Emulator Gate

on:
  workflow_dispatch:
    inputs:
      run-benchmark:
        description: Run the env-gated s3_incremental benchmark after storage/runtime tests.
        required: false
        default: false
        type: boolean
      floci-image:
        description: Floci container image to use for the local S3 emulator.
        required: false
        default: floci/floci:latest

env:
  CARGO_TERM_COLOR: always
  VELORIX_FLOCI_RUN_BENCHMARK: ${{ inputs.run-benchmark && '1' || '0' }}
  VELORIX_FLOCI_IMAGE: ${{ inputs.floci-image }}
  VELORIX_FLOCI_EVIDENCE_PATH: target/velorix-s3/floci-s3-gate-evidence.json
  VELORIX_FLOCI_BENCHMARK_PATH: target/velorix-bench/floci-s3-nightly.json

jobs:
  floci-s3:
    name: Local Floci S3 emulator gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Floci S3 emulator gate
        run: scripts/run-floci-s3-gate.sh

      - name: Upload Floci S3 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-s3-emulator-evidence
          path: |
            target/velorix-s3/floci-s3-gate-evidence.json
            target/velorix-bench/floci-s3-nightly.json
          if-no-files-found: warn
