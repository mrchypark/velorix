name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check -W unmaintained

  benchmark-smoke:
    name: benchmark JSON smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run local benchmark
        run: cargo bench --bench local_incremental > benchmark-output.jsonl

      - name: Validate benchmark JSON
        run: |
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          lines = [
              line.strip()
              for line in Path("benchmark-output.jsonl").read_text().splitlines()
              if line.strip()
          ]
          if not lines:
              raise SystemExit("benchmark produced no output")

          result = json.loads(lines[-1])
          expected_top_level = {
              "schema_version",
              "commit",
              "gate_level",
              "backend",
              "workload",
              "metrics",
          }
          missing = expected_top_level - result.keys()
          if missing:
              raise SystemExit(f"benchmark JSON missing fields: {sorted(missing)}")
          if result["schema_version"] != 1:
              raise SystemExit(f"unexpected schema_version: {result['schema_version']}")
          if result["gate_level"] != "pr_smoke":
              raise SystemExit(f"unexpected gate_level: {result['gate_level']}")
          if result["backend"] != "local":
              raise SystemExit(f"unexpected backend: {result['backend']}")
          if not result["commit"].strip() or not result["workload"].strip():
              raise SystemExit("commit and workload must be non-empty")

          metrics = result["metrics"]
          required_metrics = {
              "rows_per_second",
              "bytes_per_row",
              "put_per_gib",
              "object_requests",
              "checkpoint_p50_ms",
              "checkpoint_p95_ms",
              "recovery_p95_ms",
              "peak_rss_bytes",
              "spill_bytes",
              "scan_bytes",
          }
          missing_metrics = required_metrics - metrics.keys()
          if missing_metrics:
              raise SystemExit(
                  f"benchmark metrics missing fields: {sorted(missing_metrics)}"
              )

          for key, value in metrics.items():
              if key == "object_requests":
                  continue
              if not isinstance(value, (int, float)) or not math.isfinite(value) or value < 0:
                  raise SystemExit(f"invalid metric {key}: {value!r}")

          request_metrics = {
              "put_count",
              "get_count",
              "list_count",
              "range_read_count",
              "bytes_written",
              "bytes_read",
          }
          missing_requests = request_metrics - metrics["object_requests"].keys()
          if missing_requests:
              raise SystemExit(
                  f"object request metrics missing fields: {sorted(missing_requests)}"
              )
          for key in request_metrics:
              value = metrics["object_requests"][key]
              if not isinstance(value, int) or value < 0:
                  raise SystemExit(f"invalid object request metric {key}: {value!r}")
          PY
