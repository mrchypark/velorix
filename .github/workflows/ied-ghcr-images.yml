name: IED GHCR Images

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Velorix commit to build (IED deployment is pinned to this exact commit).
        required: false
        default: 1ffbca70dfb627fd894f3c1e34cabc46777d51a7
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: meta
            dockerfile: Dockerfile.meta
          - name: ingest-writer
            dockerfile: Dockerfile.ingest-writer
    steps:
      - name: Checkout Velorix source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}

      - name: Checkout locked Hiqlite source
        uses: actions/checkout@v4
        with:
          repository: mrchypark/hiqlite
          ref: 26c6d22a72d7bd0a1e2de073fc4c076ddad4e588
          path: hiqlite

      - name: Assert exact IED source revision
        run: test "$(git rev-parse HEAD)" = "1ffbca70dfb627fd894f3c1e34cabc46777d51a7"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable IED image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            velorix-hiqlite-source=./hiqlite
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/mrchypark/velorix-${{ matrix.name }}:${{ inputs.source-ref }}
