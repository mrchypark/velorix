name: Nightly Benchmark Gate

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      s3-result-path:
        description: Path to an existing S3-compatible benchmark JSON result.
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  S3_BENCHMARK_RESULT_PATH: ${{ inputs.s3-result-path || vars.S3_BENCHMARK_RESULT_PATH || secrets.S3_BENCHMARK_RESULT_PATH }}

jobs:
  s3-nightly:
    name: S3-compatible nightly gate
    runs-on: ubuntu-latest
    steps:
      - name: Check S3 benchmark configuration
        id: config
        run: |
          if [ -z "$S3_BENCHMARK_RESULT_PATH" ]; then
            echo "nightly gate requires S3_BENCHMARK_RESULT_PATH"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install Rust stable
        if: steps.config.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        if: steps.config.outputs.configured == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run nightly benchmark gate
        if: steps.config.outputs.configured == 'true'
        run: |
          test -f "$S3_BENCHMARK_RESULT_PATH"
          cargo run -p velorix-cli -- benchmark-gate \
            --gate-level nightly-integration \
            --backend s3-compatible \
            --baseline baselines/benchmark/s3/nightly.json \
            --result "$S3_BENCHMARK_RESULT_PATH"

      - name: Upload nightly benchmark result
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: s3-nightly-benchmark
          path: ${{ env.S3_BENCHMARK_RESULT_PATH }}
