name: Velorix GHCR Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VELORIX_SOURCE_REF: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: meta
            dockerfile: Dockerfile.meta
          - name: ingest-writer
            dockerfile: Dockerfile.ingest-writer
          - name: hiqlite
            dockerfile: Dockerfile.hiqlite
    steps:
      - name: Checkout Velorix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VELORIX_SOURCE_REF }}

      - name: Checkout locked Hiqlite source
        uses: actions/checkout@v4
        with:
          repository: mrchypark/hiqlite
          ref: 26c6d22a72d7bd0a1e2de073fc4c076ddad4e588
          path: hiqlite

      - name: Assert exact deployment source revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            velorix-hiqlite-source=./hiqlite
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/mrchypark/velorix-${{ matrix.name }}:${{ env.VELORIX_SOURCE_REF }}

      - name: Record immutable image digest
        run: |
          image="ghcr.io/mrchypark/velorix-${{ matrix.name }}:${{ env.VELORIX_SOURCE_REF }}@${{ steps.build.outputs.digest }}"
          printf 'source_ref=%s\nimage=%s\n' "${{ env.VELORIX_SOURCE_REF }}" "$image" > image-digest-${{ matrix.name }}.txt
          {
            echo "### ${{ matrix.name }} image"
            echo "- source ref: \`${{ env.VELORIX_SOURCE_REF }}\`"
            echo "- immutable image: \`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image digest
        uses: actions/upload-artifact@v4
        with:
          name: velorix-${{ matrix.name }}-image-digest
          path: image-digest-${{ matrix.name }}.txt
          if-no-files-found: error
