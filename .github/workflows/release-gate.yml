name: Release Benchmark Gate

on:
  workflow_dispatch:
    inputs:
      s3-result-path:
        description: Path to the S3-compatible release benchmark JSON result.
        required: false
        default: ""
      readiness-evidence-path:
        description: Path to the production readiness evidence JSON.
        required: false
        default: ""
      dependency-governance-evidence-path:
        description: Path to externally attested dependency governance evidence JSON.
        required: false
        default: ""
      feldera-spec-path:
        description: Path to the Feldera standing-view spec JSON.
        required: false
        default: ""
      feldera-metadata-path:
        description: Path to the Feldera compile artifact metadata JSON.
        required: false
        default: ""
      feldera-artifact-package-path:
        description: Path to the compiled Feldera artifact package.
        required: false
        default: ""
      feldera-provenance-path:
        description: Path to the Feldera release provenance JSON.
        required: false
        default: ""
      production-gc-evidence-path:
        description: Path to production GC run evidence JSON.
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RELEASE_COMMIT: ${{ github.sha }}
  S3_BENCHMARK_RESULT_PATH: ${{ inputs.s3-result-path }}
  READINESS_EVIDENCE_PATH: ${{ inputs.readiness-evidence-path }}
  DEPENDENCY_GOVERNANCE_EVIDENCE_PATH: ${{ inputs.dependency-governance-evidence-path }}
  FELDERA_SPEC_PATH: ${{ inputs.feldera-spec-path }}
  FELDERA_METADATA_PATH: ${{ inputs.feldera-metadata-path }}
  FELDERA_ARTIFACT_PACKAGE_PATH: ${{ inputs.feldera-artifact-package-path }}
  FELDERA_PROVENANCE_PATH: ${{ inputs.feldera-provenance-path }}
  PRODUCTION_GC_EVIDENCE_PATH: ${{ inputs.production-gc-evidence-path }}

jobs:
  s3-release:
    name: S3-compatible release gate
    runs-on: ubuntu-latest
    steps:
      - name: Require release inputs
        run: |
          if [ -z "$S3_BENCHMARK_RESULT_PATH" ]; then
            echo "release gate requires inputs.s3-result-path"
            exit 1
          fi
          if [ -z "$READINESS_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.readiness-evidence-path"
            exit 1
          fi
          if [ -z "$DEPENDENCY_GOVERNANCE_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.dependency-governance-evidence-path"
            exit 1
          fi
          if [ -z "$FELDERA_SPEC_PATH" ]; then
            echo "release gate requires inputs.feldera-spec-path"
            exit 1
          fi
          if [ -z "$FELDERA_METADATA_PATH" ]; then
            echo "release gate requires inputs.feldera-metadata-path"
            exit 1
          fi
          if [ -z "$FELDERA_ARTIFACT_PACKAGE_PATH" ]; then
            echo "release gate requires inputs.feldera-artifact-package-path"
            exit 1
          fi
          if [ -z "$FELDERA_PROVENANCE_PATH" ]; then
            echo "release gate requires inputs.feldera-provenance-path"
            exit 1
          fi
          if [ -z "$PRODUCTION_GC_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.production-gc-evidence-path"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependency governance
        run: |
          mkdir -p target/dependency-governance
          cargo deny -f json check -W unmaintained 2> target/dependency-governance/cargo-deny.jsonl
          cargo run -p velorix-cli -- dependency-governance-validate \
            --manifest dependency-governance.json \
            --cargo-deny-json target/dependency-governance/cargo-deny.jsonl \
            --json > target/dependency-governance/local-dependency-governance-evidence.json

      - name: Validate production readiness status matrix
        run: |
          cargo run -p velorix-cli -- release-status-validate \
            --status-matrix docs/architecture/production-readiness-status.md

      - name: Validate Feldera release artifact evidence
        run: |
          test -f "$FELDERA_SPEC_PATH"
          test -f "$FELDERA_METADATA_PATH"
          test -f "$FELDERA_ARTIFACT_PACKAGE_PATH"
          test -f "$FELDERA_PROVENANCE_PATH"
          mkdir -p target/release-evidence
          cargo run -p velorix-cli -- feldera-artifact-verify \
            --spec "$FELDERA_SPEC_PATH" \
            --metadata "$FELDERA_METADATA_PATH" \
            --artifact-package "$FELDERA_ARTIFACT_PACKAGE_PATH" \
            --json \
            > target/release-evidence/feldera-artifact-hash.json
          cargo run -p velorix-cli -- feldera-artifact-provenance-verify \
            --metadata "$FELDERA_METADATA_PATH" \
            --provenance "$FELDERA_PROVENANCE_PATH" \
            --json \
            > target/release-evidence/feldera-release-provenance.json

      - name: Run release benchmark gate
        run: |
          test -f "$S3_BENCHMARK_RESULT_PATH"
          cargo run -p velorix-cli -- benchmark-gate \
            --gate-level release \
            --backend s3-compatible \
            --baseline baselines/benchmark/s3/release.json \
            --result "$S3_BENCHMARK_RESULT_PATH" \
            --json > target/release-evidence/s3-release-benchmark-gate.json

      - name: Validate production readiness report
        run: |
          test -f "$READINESS_EVIDENCE_PATH"
          test -f "$DEPENDENCY_GOVERNANCE_EVIDENCE_PATH"
          test -f "$PRODUCTION_GC_EVIDENCE_PATH"
          cp "$READINESS_EVIDENCE_PATH" target/release-evidence/production-readiness-evidence.json
          cp "$DEPENDENCY_GOVERNANCE_EVIDENCE_PATH" target/release-evidence/dependency-governance-release-evidence.json
          cp "$PRODUCTION_GC_EVIDENCE_PATH" target/release-evidence/production-gc-run-evidence.json
          cargo run -p velorix-cli -- readiness-report \
            --evidence "$READINESS_EVIDENCE_PATH" \
            --require-release-artifacts \
            --dependency-governance-evidence "$DEPENDENCY_GOVERNANCE_EVIDENCE_PATH" \
            --dependency-governance-manifest dependency-governance.json \
            --release-commit "$RELEASE_COMMIT" \
            --feldera-artifact-hash-evidence target/release-evidence/feldera-artifact-hash.json \
            --feldera-release-provenance-evidence target/release-evidence/feldera-release-provenance.json \
            --s3-release-benchmark-gate-evidence target/release-evidence/s3-release-benchmark-gate.json \
            --production-gc-run-evidence "$PRODUCTION_GC_EVIDENCE_PATH" \
            --json \
            > target/release-evidence/production-readiness-report.json

      - name: Upload release benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: s3-release-benchmark
          path: |
            ${{ env.S3_BENCHMARK_RESULT_PATH }}
            target/release-evidence/s3-release-benchmark-gate.json

      - name: Upload dependency governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-governance-evidence
          path: target/dependency-governance/*

      - name: Upload Feldera release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: target/release-evidence/*.json
