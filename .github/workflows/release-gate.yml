name: Release Benchmark Gate

on:
  workflow_dispatch:
    inputs:
      s3-result-path:
        description: Path to the S3-compatible release benchmark JSON result.
        required: false
        default: ""
      readiness-evidence-path:
        description: Path to the production readiness evidence JSON.
        required: false
        default: ""
      production-gc-evidence-path:
        description: Path to production GC run evidence JSON.
        required: false
        default: ""
      rustfs-production-gc-validation-evidence-path:
        description: Path to RustFS production GC evidence-family validation JSON.
        required: false
        default: ""
      ingest-writer-lifecycle-evidence-path:
        description: Path to deployed ingest-writer lifecycle attestation JSON.
        required: false
        default: ""
      standing-runtime-product-evidence-path:
        description: Path to deployed product evidence JSON with required-mode standing-runtime fencing.
        required: false
        default: ""
      velorix-api-image-digest:
        description: sha256 digest of the velorix-api release image used by the product evidence.
        required: false
        default: ""
      velorix-meta-image-digest:
        description: sha256 digest of the velorix-meta release image used by the product evidence.
        required: false
        default: ""
      hiqlite-image-digest:
        description: sha256 digest of the Hiqlite authority image used by the product evidence.
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_COMMIT: ${{ github.sha }}
  S3_BENCHMARK_RESULT_PATH: ${{ inputs.s3-result-path }}
  READINESS_EVIDENCE_PATH: ${{ inputs.readiness-evidence-path }}
  PRODUCTION_GC_EVIDENCE_PATH: ${{ inputs.production-gc-evidence-path }}
  RUSTFS_PRODUCTION_GC_VALIDATION_EVIDENCE_PATH: ${{ inputs.rustfs-production-gc-validation-evidence-path }}
  INGEST_WRITER_LIFECYCLE_EVIDENCE_PATH: ${{ inputs.ingest-writer-lifecycle-evidence-path }}
  STANDING_RUNTIME_PRODUCT_EVIDENCE_PATH: ${{ inputs.standing-runtime-product-evidence-path }}
  VELORIX_API_IMAGE_DIGEST: ${{ inputs.velorix-api-image-digest }}
  VELORIX_META_IMAGE_DIGEST: ${{ inputs.velorix-meta-image-digest }}
  VELORIX_HIQLITE_IMAGE_DIGEST: ${{ inputs.hiqlite-image-digest }}

jobs:
  s3-release:
    name: S3-compatible release gate
    runs-on: ubuntu-latest
    steps:
      - name: Require release inputs
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "release gate trusted provenance requires refs/heads/main or refs/tags/v*, got ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if [ -z "$S3_BENCHMARK_RESULT_PATH" ]; then
            echo "release gate requires inputs.s3-result-path"
            exit 1
          fi
          if [ -z "$READINESS_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.readiness-evidence-path"
            exit 1
          fi
          if [ -z "$PRODUCTION_GC_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.production-gc-evidence-path"
            exit 1
          fi
          if [ -z "$RUSTFS_PRODUCTION_GC_VALIDATION_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.rustfs-production-gc-validation-evidence-path"
            exit 1
          fi
          if [ -z "$INGEST_WRITER_LIFECYCLE_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.ingest-writer-lifecycle-evidence-path"
            exit 1
          fi
          if [ -z "$STANDING_RUNTIME_PRODUCT_EVIDENCE_PATH" ]; then
            echo "release gate requires inputs.standing-runtime-product-evidence-path"
            exit 1
          fi
          if [ -z "$VELORIX_API_IMAGE_DIGEST" ]; then
            echo "release gate requires inputs.velorix-api-image-digest"
            exit 1
          fi
          if [ -z "$VELORIX_META_IMAGE_DIGEST" ]; then
            echo "release gate requires inputs.velorix-meta-image-digest"
            exit 1
          fi
          if [ -z "$VELORIX_HIQLITE_IMAGE_DIGEST" ]; then
            echo "release gate requires inputs.hiqlite-image-digest"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Check dependency governance
        run: |
          mkdir -p target/dependency-governance
          cargo deny -f json check -W unmaintained 2> target/dependency-governance/cargo-deny.jsonl
          cargo run -p velorix-cli -- dependency-governance-validate \
            --manifest dependency-governance.json \
            --cargo-deny-json target/dependency-governance/cargo-deny.jsonl \
            --json > target/dependency-governance/local-dependency-governance-evidence.json

      - name: Validate production readiness status matrix
        run: |
          cargo run -p velorix-cli -- release-status-validate \
            --status-matrix docs/architecture/production-readiness-status.md

      - name: Run release benchmark gate
        run: |
          test -f "$S3_BENCHMARK_RESULT_PATH"
          cargo run -p velorix-cli -- benchmark-gate \
            --gate-level release \
            --backend s3-compatible \
            --baseline baselines/benchmark/s3/release.json \
            --result "$S3_BENCHMARK_RESULT_PATH" \
            --json > target/release-evidence/s3-release-benchmark-gate.json

      - name: Validate production readiness report
        run: |
          test -f "$READINESS_EVIDENCE_PATH"
          test -f target/dependency-governance/local-dependency-governance-evidence.json
          test -f "$PRODUCTION_GC_EVIDENCE_PATH"
          test -f "$RUSTFS_PRODUCTION_GC_VALIDATION_EVIDENCE_PATH"
          test -f "$INGEST_WRITER_LIFECYCLE_EVIDENCE_PATH"
          test -f "$STANDING_RUNTIME_PRODUCT_EVIDENCE_PATH"
          mkdir -p target/release-evidence/rustfs-production-gc
          mkdir -p target/release-evidence/ingest-writer-lifecycle
          mkdir -p target/release-evidence/standing-runtime-product
          cp "$READINESS_EVIDENCE_PATH" target/release-evidence/production-readiness-evidence.json
          cp target/dependency-governance/local-dependency-governance-evidence.json target/release-evidence/dependency-governance-release-evidence.json
          RUSTFS_PRODUCTION_GC_VALIDATION_RELEASE_PATH="$(scripts/copy-readiness-sibling-evidence.py \
            --kind rustfs-production-gc \
            --artifact "$RUSTFS_PRODUCTION_GC_VALIDATION_EVIDENCE_PATH" \
            --out-dir target/release-evidence/rustfs-production-gc \
            --artifact-name rustfs-production-gc-validation.json)"
          test -f "$RUSTFS_PRODUCTION_GC_VALIDATION_RELEASE_PATH"
          PRODUCTION_GC_RELEASE_PATH="target/release-evidence/rustfs-production-gc/rustfs-production-gc.json"
          if ! cmp -s "$PRODUCTION_GC_EVIDENCE_PATH" "$PRODUCTION_GC_RELEASE_PATH"; then
            echo "production-gc-evidence-path does not match the production artifact bound by rustfs-production-gc-validation-evidence-path"
            exit 1
          fi
          RUSTFS_PRODUCTION_GC_RECHECKED_PATH="target/release-evidence/rustfs-production-gc/rustfs-production-gc-validation-rechecked.json"
          cargo run -p velorix-cli -- rustfs-production-gc-evidence-validate \
            --gate-evidence target/release-evidence/rustfs-production-gc/rustfs-s3-gate-evidence.json \
            --seed-evidence target/release-evidence/rustfs-production-gc/rustfs-production-gc-seed.json \
            --execute-evidence target/release-evidence/rustfs-production-gc/rustfs-production-gc-run.json \
            --production-evidence "$PRODUCTION_GC_RELEASE_PATH" \
            --json > "$RUSTFS_PRODUCTION_GC_RECHECKED_PATH"
          INGEST_WRITER_LIFECYCLE_RELEASE_PATH="$(scripts/copy-readiness-sibling-evidence.py \
            --kind ingest-writer-lifecycle \
            --artifact "$INGEST_WRITER_LIFECYCLE_EVIDENCE_PATH" \
            --out-dir target/release-evidence/ingest-writer-lifecycle \
            --artifact-name ingest-writer-lifecycle-evidence.json)"
          STANDING_RUNTIME_PRODUCT_RELEASE_PATH="$(scripts/copy-readiness-sibling-evidence.py \
            --kind product \
            --artifact "$STANDING_RUNTIME_PRODUCT_EVIDENCE_PATH" \
            --out-dir target/release-evidence/standing-runtime-product \
            --artifact-name standing-runtime-product-evidence.json)"
          HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH="target/release-evidence/standing-runtime-product/hiqlite-backend-time-canonical-bundle.txt"
          HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_PATH="target/release-evidence/standing-runtime-product/hiqlite-backend-time-canonical-bundle.sigstore.json"
          VELORIX_HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_FILE="$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH" \
            scripts/attest-hiqlite-backend-time.sh \
              --product-evidence "$STANDING_RUNTIME_PRODUCT_RELEASE_PATH" \
              --output target/release-evidence/standing-runtime-product/hiqlite-backend-time-attestation.json \
              --attester velorix-ci
          HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_SHA256="$(sha256sum "$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH" | awk '{print $1}')"
          cosign sign-blob "$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH" \
            --bundle "$HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_PATH" \
            --yes
          HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_BASE64="$(base64 -w0 "$HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_PATH")"
          HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_SHA256="sha256:$(sha256sum "$HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_PATH" | awk '{print $1}')"
          VELORIX_HIQLITE_BACKEND_TIME_TRUSTED_PROVENANCE=1 \
          VELORIX_HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_FILE="$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH" \
          VELORIX_SOURCE_REPOSITORY="github.com/mrchypark/velorix" \
          VELORIX_SOURCE_REVISION="$RELEASE_COMMIT" \
          VELORIX_RELEASE_COMMIT="$RELEASE_COMMIT" \
          VELORIX_ATTESTER=velorix-ci \
          VELORIX_CI_WORKFLOW_NAME="$GITHUB_WORKFLOW" \
          VELORIX_CI_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          VELORIX_CI_JOB_NAME="$GITHUB_JOB" \
          VELORIX_CI_OIDC_SUBJECT="repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}" \
          VELORIX_CI_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/release-gate.yml@${GITHUB_REF}" \
          VELORIX_CI_JOB_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/release-gate.yml@${RELEASE_COMMIT}" \
          VELORIX_CI_SIGSTORE_CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-gate.yml@${GITHUB_REF}" \
          VELORIX_CI_SIGSTORE_BUNDLE_BASE64="$HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_BASE64" \
          VELORIX_CI_SIGSTORE_BUNDLE_SHA256="$HIQLITE_BACKEND_TIME_SIGSTORE_BUNDLE_SHA256" \
            scripts/attest-hiqlite-backend-time.sh \
              --product-evidence "$STANDING_RUNTIME_PRODUCT_RELEASE_PATH" \
              --output target/release-evidence/standing-runtime-product/hiqlite-backend-time-attestation.json \
              --attester velorix-ci \
              --update-product-evidence
          test "$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_SHA256" = "$(sha256sum "$HIQLITE_BACKEND_TIME_CANONICAL_BUNDLE_PATH" | awk '{print $1}')"
          cargo run -p velorix-cli -- readiness-report \
            --evidence "$READINESS_EVIDENCE_PATH" \
            --require-release-artifacts \
            --dependency-governance-evidence target/dependency-governance/dependency-governance-evidence.json \
            --dependency-governance-manifest dependency-governance.json \
            --release-commit "$RELEASE_COMMIT" \
            --s3-release-benchmark-gate-evidence target/release-evidence/s3-release-benchmark-gate.json \
            --production-gc-run-evidence "$PRODUCTION_GC_RELEASE_PATH" \
            --rustfs-production-gc-validation-evidence "$RUSTFS_PRODUCTION_GC_RECHECKED_PATH" \
            --ingest-writer-lifecycle-evidence "$INGEST_WRITER_LIFECYCLE_RELEASE_PATH" \
            --standing-runtime-product-evidence "$STANDING_RUNTIME_PRODUCT_RELEASE_PATH" \
            --json \
            > target/release-evidence/production-readiness-report.json

      - name: Upload release benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: s3-release-benchmark
          path: |
            ${{ env.S3_BENCHMARK_RESULT_PATH }}
            target/release-evidence/s3-release-benchmark-gate.json

      - name: Upload dependency governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-governance-evidence
          path: target/dependency-governance/*

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            target/release-evidence/*.json
            target/release-evidence/rustfs-production-gc/**
            target/release-evidence/ingest-writer-lifecycle/**
            target/release-evidence/standing-runtime-product/**
