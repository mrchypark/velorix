name: RustFS S3-Compatible Gate

on:
  workflow_dispatch:
    inputs:
      rustfs-image:
        description: RustFS image pinned to a sha256 digest for the S3-compatible gate.
        required: false
        default: rustfs/rustfs@sha256:f7cb98ef492fa3c3ed0dbd65df3ce2dd205c666e24e7d7234d9402c9ed1001f9

env:
  CARGO_TERM_COLOR: always
  VELORIX_RUSTFS_IMAGE: ${{ inputs.rustfs-image }}
  VELORIX_RUSTFS_EVIDENCE_PATH: target/velorix-s3/rustfs-s3-gate-evidence.json

jobs:
  rustfs-s3:
    name: RustFS S3-compatible gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run RustFS S3-compatible gate
        run: scripts/run-rustfs-s3-gate.sh

      - name: Upload RustFS S3-compatible evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rustfs-s3-compatible-evidence
          path: |
            target/velorix-s3/rustfs-s3-gate-evidence.json
          if-no-files-found: warn
