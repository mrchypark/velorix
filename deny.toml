[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # The authority path uses object_store 0.14 / quick-xml 0.41. The remaining
  # quick-xml 0.39 path is pinned Hiqlite -> cryptr -> s3-simple and has
  # owner/expiry records in dependency-governance.json.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/mrchypark/hiqlite.git"]
