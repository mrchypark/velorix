apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Render-only overlay for the official Rhiza 0.19.0 recovery-operator manifests.
#
# The three upstream files are vendored byte-for-byte from tag v0.19.0 of
# github.com/mrchypark/rhiza (deploy/operator/). Their hashes are recorded in
# UPSTREAM.sha256 and verified by scripts/run-rhiza-kv-k8s-gate.sh before any
# apply, so this overlay can never silently drift from the official contract.
#
# Only two things are changed here, and both are required by the official
# deployment notes:
#   * namespace  - the operator is namespace-scoped, so its ServiceAccount, Role,
#                  RoleBinding, and Deployment must live in the same namespace as
#                  the application StatefulSet it recovers.
#   * image      - the upstream sample uses the local name `rhiza-operator:latest`.
#                  Production and any validation run must pin the released image.
#
# The CRD is cluster-scoped and is applied separately, because installing or
# removing it mutates the whole cluster rather than the validation namespace.
resources:
  - crd.yaml
  - rbac.yaml
  - deployment.yaml
images:
  - name: rhiza-operator
    newName: ghcr.io/mrchypark/rhiza-operator
    # Exact official v0.19.0 pin. Upstream publishes linux/amd64 only, and the
    # v0.19.0 release publishes one platform manifest, so the per-platform
    # manifest digest is the only digest this tag resolves to on any node.
    digest: "sha256:00b5e7a4c33c84ddbc2b7272b7d06bd3dd8315e31acb29507ad627d522a19d67"