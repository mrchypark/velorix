[package]
name = "velorix-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
sigstore-trust-root = { workspace = true }
sigstore-types = { workspace = true }
sigstore-verify = { workspace = true }
tokio = { workspace = true }
velorix-k8s = { path = "../velorix-k8s" }
velorix-meta = { path = "../velorix-meta" }
velorix-control = { path = "../velorix-control" }
velorix-core = { path = "../velorix-core" }
velorix-runtime = { path = "../velorix-runtime" }

[dev-dependencies]
arrow = { workspace = true, features = ["ipc"] }
tempfile = { workspace = true }
