[package]
name = "velorix-meta"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[features]
hiqlite-backend = ["dep:hiqlite"]
rhiza-backend = ["dep:rhizadb", "dep:uuid", "dep:base64"]

[dependencies]
anyhow = { workspace = true }
base64 = { version = "0.22", optional = true }
async-trait = { workspace = true }
# Pin the fork commit that contains Raft-serialized timestamp transactions.
# The remote client and standalone server must compile the same streaming API
# enum shape. The server image uses `--features server`, which enables `full`.
hiqlite = { git = "https://github.com/mrchypark/hiqlite.git", rev = "26c6d22a72d7bd0a1e2de073fc4c076ddad4e588", package = "hiqlite", default-features = false, features = ["full"], optional = true }
rhizadb = { version = "=0.12.0", optional = true }
uuid = { workspace = true, optional = true }
object_store = { workspace = true, features = ["aws"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
velorix-core = { path = "../velorix-core" }
velorix-storage = { path = "../velorix-storage" }

# Durable backend target:
# Use mrchypark/hiqlite at 26c6d22a72d7bd0a1e2de073fc4c076ddad4e588 until
# sebadob/hiqlite includes the same Raft-serialized timestamp API in a release.

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
