syntax = "proto3";

package velorix.meta.v1;

service VelorixMeta {
  rpc ReadMetaStoreCapabilities(ReadMetaStoreCapabilitiesRequest) returns (ReadMetaStoreCapabilitiesResponse);
  rpc StoreRelationCatalog(StoreRelationCatalogRequest) returns (StoreRelationCatalogResponse);
  rpc ReadRelationCatalog(ReadRelationCatalogRequest) returns (ReadRelationCatalogResponse);
  rpc ReserveIngestRange(ReserveIngestRangeRequest) returns (ReserveIngestRangeResponse);
  rpc ReserveAuthoritativeIngestRange(ReserveAuthoritativeIngestRangeRequest) returns (ReserveIngestRangeResponse);
  rpc CommitIngestRange(ReserveIngestRangeRequest) returns (CommitIngestRangeResponse);
  rpc PublishIngestReservation(PublishIngestReservationRequest) returns (PublishIngestReservationResponse);
  rpc ReadAuthoritativeIngestPublication(ReadAuthoritativeIngestPublicationRequest) returns (ReadAuthoritativeIngestPublicationResponse);
  rpc ListAuthoritativeIngestPublications(ListAuthoritativeIngestPublicationsRequest) returns (ListAuthoritativeIngestPublicationsResponse);
  rpc CaptureIngestSourceCut(CaptureIngestSourceCutRequest) returns (CaptureIngestSourceCutResponse);
  rpc CaptureRelationIngestSourceCut(CaptureRelationIngestSourceCutRequest) returns (CaptureRelationIngestSourceCutResponse);
  rpc BeginViewBootstrap(BeginViewBootstrapRequest) returns (BeginViewBootstrapResponse);
  rpc ReadViewBootstrap(ReadViewBootstrapRequest) returns (ReadViewBootstrapResponse);
  rpc FixViewBootstrapActivationCut(FixViewBootstrapActivationCutRequest) returns (FixViewBootstrapActivationCutResponse);
  rpc PromoteViewBootstrap(PromoteViewBootstrapRequest) returns (PromoteViewBootstrapResponse);
  rpc AcquireStandingRuntimeOwner(AcquireStandingRuntimeOwnerRequest) returns (AcquireStandingRuntimeOwnerResponse);
  rpc ReadStandingRuntimeOwner(ReadStandingRuntimeOwnerRequest) returns (ReadStandingRuntimeOwnerResponse);
  rpc PublishStandingRuntimeCheckpoint(PublishStandingRuntimeCheckpointRequest) returns (PublishStandingRuntimeCheckpointResponse);
  rpc ReadStandingRuntimeCheckpoint(ReadStandingRuntimeCheckpointRequest) returns (ReadStandingRuntimeCheckpointResponse);
  rpc ReadViewDependencyGraphRevision(ReadViewDependencyGraphRevisionRequest) returns (ReadViewDependencyGraphRevisionResponse);
  rpc ReadPartitionAuthorityCapability(ReadPartitionAuthorityCapabilityRequest) returns (ReadPartitionAuthorityCapabilityResponse);
  rpc AcquirePartitionAuthority(AcquirePartitionAuthorityRequest) returns (AcquirePartitionAuthorityResponse);
  rpc ReadPartitionAuthority(ReadPartitionAuthorityRequest) returns (ReadPartitionAuthorityResponse);
  rpc AcquireRelationPartitionAuthority(AcquireRelationPartitionAuthorityRequest) returns (AcquireRelationPartitionAuthorityResponse);
  rpc ReadRelationPartitionAuthority(ReadRelationPartitionAuthorityRequest) returns (ReadRelationPartitionAuthorityResponse);
  rpc ReserveRelationAuthoritativeIngestRange(ReserveRelationAuthoritativeIngestRangeRequest) returns (ReserveIngestRangeResponse);
  rpc PublishRelationIngestReservation(PublishRelationIngestReservationRequest) returns (PublishIngestReservationResponse);
  rpc ReadRelationAuthoritativeIngestPublication(ReadRelationAuthoritativeIngestPublicationRequest) returns (ReadRelationAuthoritativeIngestPublicationResponse);
  rpc ListRelationAuthoritativeIngestPublications(ListRelationAuthoritativeIngestPublicationsRequest) returns (ListRelationAuthoritativeIngestPublicationsResponse);
  rpc PublishPartitionCheckpointPointer(PublishPartitionCheckpointPointerRequest) returns (PublishPartitionCheckpointPointerResponse);
  rpc ReadPartitionCheckpointPointer(ReadPartitionCheckpointPointerRequest) returns (ReadPartitionCheckpointPointerResponse);
}

message ReadViewDependencyGraphRevisionRequest {
  string tenant_id = 1;
}

message ReadViewDependencyGraphRevisionResponse {
  uint64 revision = 1;
}

message ReadMetaStoreCapabilitiesRequest {}

message StandingRuntimeFencingCapability {
  uint32 capability_schema_version = 1;
  string backend_name = 2;
  string owner_scope_kind = 3;
  bool linearizable_owner_lease = 4;
  bool durable_monotonic_owner_epoch = 5;
  bool authoritative_backend_time = 6;
  bool owner_validated_checkpoint_publish = 7;
  bool publish_checks_owner_and_latest_atomically = 8;
  bool publish_rejects_expired_owner = 9;
  bool latest_read_linearizable = 10;
  bool publish_rejects_scope_mismatch = 11;
  uint64 max_owner_ttl_ms = 12;
  bool control_plane_auth_enforced = 13;
  bool production_multi_writer_safe = 14;
  string backend_time_source_kind = 15;
  string backend_time_blocked_reason = 16;
  string lease_authority_kind = 17;
  string lease_expiry_semantics = 18;
  bool bounded_wall_clock_failover = 19;
  uint64 failover_time_bound_ms = 20;
  bool multi_writer_fencing_safe = 21;
  bool production_bounded_failover_safe = 22;
}

message ReadMetaStoreCapabilitiesResponse {
  StandingRuntimeFencingCapability standing_runtime_fencing = 1;
  PartitionAuthorityCapability partition_authority = 2;
  RelationIngestCapability relation_ingest = 3;
}

message RelationIngestCapability {
  string backend_name = 1;
  bool relation_scoped_authority = 2;
  bool committed_publication_source_cut = 3;
  bool durable_across_restart = 4;
}

message PartitionAuthorityCapability {
  string backend_name = 1;
  bool partition_scoped_authority = 2;
  bool backend_owned_time = 3;
  bool fenced_checkpoint_pointer_publish = 4;
  bool durable_across_restart = 5;
  bool production_safe = 6;
}

message PartitionAuthorityKey {
  string namespace = 1;
  string view_id = 2;
  string stream_id = 3;
  uint32 partition_id = 4;
}

message PartitionAuthorityToken {
  PartitionAuthorityKey key = 1;
  string owner_id = 2;
  uint64 owner_epoch = 3;
  uint64 expires_at_unix_ms = 4;
}

// Relation ingest authority is deliberately separate from view/worker
// partition authority.  Field names are not aliases for PartitionAuthorityKey.
message RelationPartitionAuthorityKey {
  string namespace = 1;
  string relation_id = 2;
  string stream_id = 3;
  uint32 partition_id = 4;
}

message RelationPartitionAuthorityToken {
  RelationPartitionAuthorityKey key = 1;
  string owner_id = 2;
  uint64 owner_epoch = 3;
  uint64 expires_at_unix_ms = 4;
}

message AcquireRelationPartitionAuthorityRequest {
  RelationPartitionAuthorityKey key = 1;
  string owner_id = 2;
  RelationPartitionAuthorityToken current_token = 3;
  uint64 ttl_ms = 4;
}

message AcquireRelationPartitionAuthorityResponse {
  string outcome = 1;
  RelationPartitionAuthorityToken token = 2;
}

message ReadRelationPartitionAuthorityRequest { RelationPartitionAuthorityKey key = 1; }
message ReadRelationPartitionAuthorityResponse {
  bool found = 1;
  RelationPartitionAuthorityToken token = 2;
}

message PartitionCheckpointPointer {
  PartitionAuthorityKey key = 1;
  string checkpoint_key = 2;
}

message ReadPartitionAuthorityCapabilityRequest {}

message ReadPartitionAuthorityCapabilityResponse {
  PartitionAuthorityCapability capability = 1;
}

message AcquirePartitionAuthorityRequest {
  PartitionAuthorityKey key = 1;
  string owner_id = 2;
  PartitionAuthorityToken current_token = 3;
  uint64 ttl_ms = 4;
}

message AcquirePartitionAuthorityResponse {
  string outcome = 1;
  PartitionAuthorityToken token = 2;
}

message ReadPartitionAuthorityRequest {
  PartitionAuthorityKey key = 1;
}

message ReadPartitionAuthorityResponse {
  bool found = 1;
  PartitionAuthorityToken token = 2;
}

message PublishPartitionCheckpointPointerRequest {
  PartitionCheckpointPointer expected_previous = 1;
  PartitionCheckpointPointer candidate = 2;
  PartitionAuthorityToken authority = 3;
}

message PublishPartitionCheckpointPointerResponse {
  string outcome = 1;
}

message ReadPartitionCheckpointPointerRequest {
  PartitionAuthorityKey key = 1;
}

message ReadPartitionCheckpointPointerResponse {
  bool found = 1;
  PartitionCheckpointPointer pointer = 2;
}

message StoreRelationCatalogRequest {
  bytes catalog_json = 1;
}

message StoreRelationCatalogResponse {
  string outcome = 1;
}

message ReadRelationCatalogRequest {
  string relation_id = 1;
  string relation_version = 2;
}

message ReadRelationCatalogResponse {
  bytes catalog_json = 1;
}

message ReserveIngestRangeRequest {
  string stream_id = 1;
  uint32 partition_id = 2;
  uint64 start_offset_inclusive = 3;
  uint64 end_offset_exclusive = 4;
  string batch_key = 5;
  string payload_digest = 6;
  string relation_id = 7;
  string relation_version = 8;
  string schema_fingerprint = 9;
  uint64 writer_epoch = 10;
}

message ReserveIngestRangeResponse {
  string outcome = 1;
}

message ReserveAuthoritativeIngestRangeRequest {
  ReserveIngestRangeRequest reservation = 1;
  PartitionAuthorityToken authority = 2;
}

message CommitIngestRangeResponse {
  string outcome = 1;
}

message PublishIngestReservationRequest {
  ReserveIngestRangeRequest reservation = 1;
  PartitionAuthorityToken authority = 2;
  string request_id = 3;
  string request_digest = 4;
  string object_key = 5;
  string object_digest = 6;
}

message PublishIngestReservationResponse {
  string outcome = 1;
}

message ReserveRelationAuthoritativeIngestRangeRequest {
  ReserveIngestRangeRequest reservation = 1;
  RelationPartitionAuthorityToken authority = 2;
}

message PublishRelationIngestReservationRequest {
  ReserveIngestRangeRequest reservation = 1;
  RelationPartitionAuthorityToken authority = 2;
  string request_id = 3;
  string request_digest = 4;
  string object_key = 5;
  string object_digest = 6;
}

message RelationAuthoritativeIngestPublication {
  ReserveIngestRangeRequest reservation = 1;
  RelationPartitionAuthorityKey authority_key = 2;
  string request_id = 3;
  string request_digest = 4;
  string object_key = 5;
  string object_digest = 6;
}

message ReadRelationAuthoritativeIngestPublicationRequest { string request_id = 1; }
message ReadRelationAuthoritativeIngestPublicationResponse {
  bool found = 1;
  RelationAuthoritativeIngestPublication publication = 2;
}
message ListRelationAuthoritativeIngestPublicationsRequest { RelationPartitionAuthorityKey key = 1; }
message ListRelationAuthoritativeIngestPublicationsResponse {
  repeated RelationAuthoritativeIngestPublication publications = 1;
}

message CaptureRelationIngestSourceCutRequest {
  RelationPartitionAuthorityKey authority = 1;
}

message CaptureRelationIngestSourceCutResponse {
  bytes source_cut_json = 1;
}

message AuthoritativeIngestPublication {
  ReserveIngestRangeRequest reservation = 1;
  PartitionAuthorityKey authority_key = 2;
  string request_id = 3;
  string request_digest = 4;
  string object_key = 5;
  string object_digest = 6;
}

message ReadAuthoritativeIngestPublicationRequest { string request_id = 1; }
message ReadAuthoritativeIngestPublicationResponse { bool found = 1; AuthoritativeIngestPublication publication = 2; }
message ListAuthoritativeIngestPublicationsRequest { PartitionAuthorityKey key = 1; }
message ListAuthoritativeIngestPublicationsResponse { repeated AuthoritativeIngestPublication publications = 1; }

message CaptureIngestSourceCutRequest {
  bytes request_json = 1;
}

message CaptureIngestSourceCutResponse {
  bytes source_cut_json = 1;
}

message BeginViewBootstrapRequest {
  bytes request_json = 1;
}

message BeginViewBootstrapResponse {
  string outcome = 1;
  bytes control_json = 2;
}

message ReadViewBootstrapRequest {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
}

message ReadViewBootstrapResponse {
  bool found = 1;
  bytes control_json = 2;
}

message FixViewBootstrapActivationCutRequest {
  bytes request_json = 1;
}

message FixViewBootstrapActivationCutResponse {
  string outcome = 1;
  bytes control_json = 2;
}

message PromoteViewBootstrapRequest {
  bytes request_json = 1;
}

message PromoteViewBootstrapResponse {
  string outcome = 1;
  bytes control_json = 2;
}

message StandingRuntimeCheckpointPointer {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
  string checkpoint_key = 4;
  uint64 logical_epoch = 5;
  string content_hash = 6;
  repeated string output_manifest_refs = 7;
  string manifest_hash = 8;
  uint64 bootstrap_generation = 9;
  string plan_hash = 10;
  string coverage_hash = 11;
  bytes input_coverage_json = 12;
  string previous_checkpoint_key = 13;
  string previous_manifest_hash = 14;
}

message StandingRuntimeOwnerClaim {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
  string owner_id = 4;
  uint64 owner_epoch = 5;
  uint64 expires_at_unix_ms = 6;
}

message StandingRuntimeOwnerToken {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
  string owner_id = 4;
  uint64 owner_epoch = 5;
}

message AcquireStandingRuntimeOwnerRequest {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
  string owner_id = 4;
  uint64 ttl_ms = 5;
}

message AcquireStandingRuntimeOwnerResponse {
  string outcome = 1;
  StandingRuntimeOwnerClaim claim = 2;
}

message ReadStandingRuntimeOwnerRequest {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
}

message ReadStandingRuntimeOwnerResponse {
  bool found = 1;
  StandingRuntimeOwnerClaim claim = 2;
}

message PublishStandingRuntimeCheckpointRequest {
  StandingRuntimeCheckpointPointer expected_previous = 1;
  StandingRuntimeCheckpointPointer candidate = 2;
  StandingRuntimeOwnerToken owner = 3;
}

message PublishStandingRuntimeCheckpointResponse {
  string outcome = 1;
}

message ReadStandingRuntimeCheckpointRequest {
  string tenant_id = 1;
  string program_id = 2;
  string view_id = 3;
}

message ReadStandingRuntimeCheckpointResponse {
  bool found = 1;
  StandingRuntimeCheckpointPointer pointer = 2;
}
