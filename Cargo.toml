[workspace]
members = [
  "crates/velorix-core",
  "crates/velorix-control",
  "crates/velorix-storage",
  "crates/velorix-runtime",
  "crates/velorix-cli",
  "crates/velorix-k8s",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
arrow = { version = "58.2.0", default-features = false }
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
datafusion = { version = "53.1.0", default-features = false, features = ["sql", "parquet"] }
foyer = "0.22"
futures = "0.3"
k8s-openapi = "0.27.1"
kube = { version = "3.1.0", default-features = false }
object_store = "0.12"
parquet = "58.2.0"
proptest = "1"
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slatedb = { version = "0.12.1", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
